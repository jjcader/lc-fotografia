<dialog class="lightbox" aria-label="Podgląd zdjęcia" data-lightbox-dialog>
  <div class="lightbox__bar">
    <span class="lightbox__count" data-lb-count>1 / 1</span>
    <button class="lightbox__btn" type="button" aria-label="Zamknij podgląd" data-lb-close>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <figure class="lightbox__figure" data-lb-stage>
    <img data-lb-img alt="">
    <figcaption data-lb-caption></figcaption>
  </figure>
  <button class="lightbox__btn lightbox__prev" type="button" aria-label="Poprzednie zdjęcie" data-lb-prev>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="lightbox__btn lightbox__next" type="button" aria-label="Następne zdjęcie" data-lb-next>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</dialog>
