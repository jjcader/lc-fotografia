<section class="page-head">
  <div class="wrap page-head__inner">
    <h1 class="h1">Kontakt</h1>
    <p class="lead">Odpowiadam w ciągu {{reply_time}}.</p>
  </div>
</section>

<section class="section section--flush">
  <div class="wrap contact contact--page">
    <div class="contact__info">
      <dl class="contact__list">
        <div><dt>Telefon</dt><dd><a href="tel:{{phone_href}}">{{phone}}</a></dd></div>
        <div><dt>E-mail</dt><dd><a href="mailto:{{email}}">{{email}}</a></dd></div>
        <div><dt>Studio</dt><dd>{{address_street}}<br>{{address_city}}<br><a class="small" href="{{maps_url}}" rel="noopener" target="_blank">Mapy Google</a></dd></div>
        <div><dt>Sesje</dt><dd>{{hours}}</dd></div>
        <div><dt>Dane firmy</dt><dd class="small">{{company_name}}<br>NIP {{nip}}<br>REGON {{regon}}</dd></div>
        <div><dt>Social media</dt><dd><a href="{{instagram_url}}" rel="noopener" target="_blank">Instagram</a> · <a href="{{linkedin_url}}" rel="noopener" target="_blank">LinkedIn</a></dd></div>
      </dl>
      <a class="btn" href="rezerwacja.html">Zarezerwuj sesję</a>
    </div>
    <div class="map" id="mapa">
      <iframe src="{{maps_embed_url}}" title="Mapa dojazdu do studia: {{address_street}}, {{address_city}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div>
</section>
