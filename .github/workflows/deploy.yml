# Buduje stronę (python3 build.py) i publikuje folder dist/ na GitHub Pages.
# NIEUŻYWANY: konto GitHub ma blokadę Actions, więc strona idzie z gałęzi gh-pages (publish.sh).
# Żeby wrócić do tej metody: dopisz z powrotem "push: branches: [main]" poniżej
# i ustaw Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
